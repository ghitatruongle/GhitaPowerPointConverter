<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: file:; media-src data: file:; font-src data:; style-src 'unsafe-inline';">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #9d174d;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .slide-canvas {
    width: 100%;
    height: 100%;
    padding: 3.5vw 4.5vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
    position: relative;
  }
</style>
</head><body>
<div class="slide-canvas">
<div data-bg-color="#9d174d" class="slide" style="font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; padding: 48px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; justify-content: center;">
  <p style="margin: 0 0 12px; font-size: 1.1em; text-transform: uppercase; letter-spacing: 4px; color: #fda4af; font-weight: 600;">You're Invited!</p>
  <h1 style="font-size: 2.8em; margin: 0 0 8px; font-weight: 800; letter-spacing: -1px;">Annual Design Conference</h1>
  <h2 style="font-size: 1.2em; font-weight: 300; color: #fecdd3; margin: 0 0 40px;">Creativity Meets Innovation &mdash; 2026 Edition</h2>
  <div style="display: flex; justify-content: center; gap: 40px; font-size: 1.05em;">
    <div>
      <p style="margin: 0 0 4px; color: #fda4af; font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;">Date</p>
      <p style="margin: 0; font-weight: 600;">October 15, 2026</p>
    </div>
    <div>
      <p style="margin: 0 0 4px; color: #fda4af; font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;">Time</p>
      <p style="margin: 0; font-weight: 600;">9:00 AM &ndash; 5:00 PM</p>
    </div>
    <div>
      <p style="margin: 0 0 4px; color: #fda4af; font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;">Location</p>
      <p style="margin: 0; font-weight: 600;">Grand Hall, NYC</p>
    </div>
  </div>
  <div style="margin-top: 40px;">
    <span style="background: #fff; color: #9d174d; padding: 14px 40px; border-radius: 50px; font-weight: 700; font-size: 1.05em;">Register Now</span>
  </div>
</div>

</div>
</body></html>
