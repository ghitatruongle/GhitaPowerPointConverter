<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    position: relative;

</head><body>
<div class="slide-canvas">
<div data-bg-color="#1a1a2e" style="padding:60px 40px;font-family:Arial,sans-serif;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;text-align:center;">
  <h1 style="font-size:3em;font-weight:800;letter-spacing:-1px;margin:0 0 20px;line-height:1.15;">Presentation Title</h1>

  <h2 style="font-size:1.3em;font-weight:400;opacity:0.75;margin:0;letter-spacing:2px;">Your Name &bull; Date</h2>
</div>

</div>
