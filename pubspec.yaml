name: ghita_ppt_converter
description: A Flutter app for creating PowerPoint presentations with HTML support and AI chat integration
publish_to: none
version: 2.0.5-demo+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  archive: ^3.3.7
  crypto: ^3.0.3
  collection: ^1.19.0
  path: ^1.8.3
  html: ^0.15.2
  image: ^4.1.0
  pdf: ^3.10.0
  printing: ^5.14.0
  http: ^1.1.0
  provider: ^6.0.5

  # Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # UI & Animation
  flutter_animate: ^4.2.0
  webview_windows: ^0.4.0

  # v1.2.0 — New dependencies
  ffi: ^2.1.0                  # Win32 eyedropper bindings (Track 24)
  file_picker: ^8.0.0          # Open/Save file dialogs
  record: ^7.1.1               # Audio recording (narration capture)
  xml: ^6.5.0                  # PPTX/DOCX parsing (Track 66)
  shelf: ^1.4.0                # HTTP server for collaboration
  shelf_router: ^1.1.0         # Router for shelf server
  network_info_plus: ^5.0.0    # Local IP for collaboration/broadcast
  qr_flutter: ^4.1.0           # QR code generation
  window_manager: ^0.3.0       # Window management (resize, fullscreen)

  # v1.5.0 — New dependencies
  intl: ^0.20.2                # Localization support (matches flutter_localizations)

  # v2.0.5-demo — Rust core (flutter_rust_bridge via cargokit glue plugin)
  ghita_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/providers.json
    - assets/images/
    - assets/templates/
